<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Alfredo Galdames, ingeniero informático full-stack. APIs escalables e interfaces rápidas, de Oracle a React." />
    <meta name="theme-color" content="#f7f5f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121016" media="(prefers-color-scheme: dark)" />
    <title>Alfredo Galdames — Ingeniero Informático Full-Stack</title>
    <script>
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) && matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark")
      }
    </script>
  </head>

    <div id="root"></div>

  </body>
